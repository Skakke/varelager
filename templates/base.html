<!-- templates/base.html -->
<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}Varelager</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
    <script src="{{ url_for('static', path='/script.js') }}" defer></script>
  </head>
  <body>
    <!-- Header og footer er samme på alle sider -->
    <header class="topbar">
      <a class="brand" href="/">Varelager</a>
      <a class="submit-button welcome-action" href="/nyvare">Legg til vare</a>
      <a class="submit-button welcome-action" href="/nykategori"
        >Legg til kategori</a
      >
      <a class="submit-button welcome-action" href="/varer">Varer</a>
      <a class="submit-button welcome-action" href="/endrevare">Endre vare</a>
      <a class="submit-button welcome-action" href="/vareutinn">Inn/Ut</a>
      <span class="topbar-meta"></span>
    </header>

    <!-- Begrenser bredden på innholdet og sentrerer det på siden. Jinja2 for å sette inn dynamisk innhold i main delen av side-->
    <main class="page-shell">{% block content %} {% endblock %}</main>

    <footer class="page-shell storage-note">© Hans og Daniela 2026</footer>
  </body>
</html>
